name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: scientific-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements-terrain.txt
      - name: Check source syntax without running download scripts
        run: python -m compileall -q scripts tests
      - name: Run computational checks without raw data or credentials
        run: python -m unittest discover -s tests -v
